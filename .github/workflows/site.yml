name: Site

# The website is its own gate, on its own trigger. It runs only when something under
# site/ changes (or this file does), so the app's CI and the site's never wait on each
# other. scripts/check.ps1 stays the app's gate and knows nothing about the site.
#
# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, as in
# ci.yml, and for the same reason.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Biome (format, import order, lint) -> ESLint (React, Next) -> tsc.
      # The non-mutating mode, so a branch is never quietly reformatted.
      - name: Quality gate
        working-directory: site
        run: npm run check:ci

      - name: Build
        working-directory: site
        run: npm run build
