[package]
name = "inlay"
description = "Live widgets set into your Windows 11 desktop: a clock, a music visualizer, synced lyrics and a player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inlay-core.workspace = true
rustfft.workspace = true
serde_json.workspace = true
# The `implement` macro expands to paths under `::windows_core`.
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "Web_Http",
    "Web_Http_Headers",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Compiles version.rc (the exe's version information) with the Windows SDK's rc.exe.
embed-resource = "=3.0.12"

[lints]
workspace = true
