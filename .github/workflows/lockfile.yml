# Resolves Cargo.lock on a runner. The maintainer's machine has no Rust
# toolchain, so a change to a Cargo.toml that alters third-party packages is
# followed by running this on the branch and committing the uploaded Cargo.lock.
name: lockfile
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo update --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo.lock
          path: Cargo.lock
