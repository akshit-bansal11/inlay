name: CI

# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, and Dependabot moves the
# SHA the same way it would move a tag. A tag is a moving pointer: whoever controls an action's repository
# can repoint it, and the code it then runs is inside this job.
#
# Rust comes from the runner image through rustup, not from an action, for the same reason.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows: the Windows app only compiles there. The desk job below covers macOS and Linux.
  gate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The same script as the local gate, in its non-mutating mode.
      - name: Quality gate
        run: pwsh scripts/check.ps1 -Ci

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      # The runner has no GPU, no Spotify and no audio device. The snapshot
      # mode needs none of them and still exercises every widget's drawing.
      - name: Render snapshots
        shell: pwsh
        run: |
          $run = Start-Process -FilePath target/release/inlay.exe -ArgumentList '--snapshot', 'snapshots' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/inlay/inlay.log" -ErrorAction SilentlyContinue
            throw "snapshot exited with $($run.ExitCode)"
          }
          Get-ChildItem snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inlay-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/inlay.exe
            snapshots/*.png

  # The macOS and Linux front-end. Its Windows stub is covered by the gate above.
  desk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy -p inlay-core -p inlay-desk --all-targets --locked -- -D warnings
      - run: cargo test -p inlay-core -p inlay-desk --locked
      - run: cargo build -p inlay-desk --release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inlay-desk-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: target/release/inlay-desk
