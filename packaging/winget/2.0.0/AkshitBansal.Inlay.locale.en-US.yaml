ShortDescription: Live widgets set into your Windows 11 desktop, a clock, a spectrum visualizer, synced lyrics and a player.
Description: One small native tray app that sets four live widgets into the desktop, under your windows. Each redraws only when something on it changes. The visualizer, lyrics and player follow whatever Spotify plays, with no Spotify login. A light alternative to Rainmeter. Formerly Deskbeat.
